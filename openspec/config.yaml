schema: spec-driven

context: |
  ## Project

  Entry to the Kaggle Solar Filament Segmentation Challenge 2026 (MAGFiLO, GONG H-alpha, 2048 x 2048 px):
  instance segmentation of solar filaments, scored by Panoptic Quality (PQ) pooled over annotator-image
  entries (TP at IoU > 0.5; PQ = sum IoU(TP) / (TP + 0.5 FP + 0.5 FN)). Deadline 2026-11-15 23:59 CDT.
  Deliverables: a 4-page ACM report (report/), a public repository with requirements.txt, one notebook
  (pipeline.ipynb, generated by scripts/make_notebook.py) and the weights. Solo work on one shared Apple
  M3 Max: one heavy GPU job at a time.

  ## Where the truth lives

  - `openspec/specs/<capability>/spec.md`: what the pipeline does NOW (requirements + scenarios).
  - `openspec/changes/<slug>/`: work we intend to do or are doing; `changes/archive/`: changes that landed
    or were rejected, kept so the reasoning stays readable.
  - `docs/DESIGN.md`: the experiment log with every number, including failures. A change's results go
    there as well, and the change links to the DESIGN entry.
  - `README.md`, `report/main.tex`, `pipeline.ipynb`: the deliverables; a change that alters the
    submitted pipeline updates all three.

  ## Rules every change follows

  - Evidence is out-of-fold (5-fold GroupKFold by calendar month, 707 training images), compared PAIRED
    against the current pipeline with a bootstrap over images (`scripts/experiments/stage2_oof.py compare`,
    `scripts/experiments/bootstrap_pq.py`), with per-fold results. The public leaderboard (about 90 images,
    two decimals, +-0.027) is never evidence.
  - No external labels or data (public MAGFiLO, HSOS, SWEFil, helios_cnn), no exploitation of the scorer's
    missing one-to-one matching, masks always pixel-disjoint.
  - Public notebooks are read as text only, never executed.
  - Every number is labelled MEASURED (OOF on all 707 images), SUBSAMPLE, or ESTIMATED.

rules:
  proposal:
    - "Include: Why, What Changes, Non-goals, Falsified by (the OOF result that would reject the change), Cost (GPU/CPU hours on the M3 Max)."
    - Cite the source of an adopted idea (paper, notebook) and its own claimed gain.
  tasks:
    - Each task names the command that verifies it; tick a task only with the result written next to it.
    - The last task group updates docs/DESIGN.md, and if the submission changes, README, report and notebook.
  specs:
    - Requirements describe observable pipeline behaviour (inputs, outputs, thresholds, evidence), not code structure.
